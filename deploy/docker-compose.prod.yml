# Kyren on one VM: Postgres, migrations, the app, a cron runner and Caddy
# for HTTPS. From the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env --profile db up -d --build
# Leave out `--profile db` and set DATABASE_URL to use an outside database
# (for example Neon). See deploy/README.md.

name: kyren-prod

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgres://kyren:${POSTGRES_PASSWORD:-}@db:5432/kyren}
  # Database connections the app keeps open (deploy/README.md, Capacity).
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ characters)}
  BETTER_AUTH_URL: https://${DOMAIN:?set DOMAIN}
  NEXT_PUBLIC_BASE_URL: https://${DOMAIN}
  RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
  # Bounces and spam complaints from Resend (deploy/README.md, Email).
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
  ORGANIZATIONS_PER_PERSON: ${ORGANIZATIONS_PER_PERSON:-10}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
  # Files go on the uploads volume unless FILE_STORAGE=s3 and S3_* are set.
  FILE_STORAGE: ${FILE_STORAGE:-local}
  FILE_STORAGE_DIR: /data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # Virus scanning of uploads: start with `--profile clamav` and set
  # CLAMAV_ADDRESS=clamav:3310 (deploy/README.md, Virus scanning).
  CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
  # Caddy writes X-Real-IP from the real connection and drops any address
  # headers a client sent, so only that one is trusted.
  CLIENT_IP_HEADERS: x-real-ip

services:
  db:
    image: postgres:17-alpine
    profiles: [db]
    # Compose interpolates disabled profiles too. Check the password only
    # when this database actually starts.
    entrypoint:
      - /bin/sh
      - -ec
      - ': "$${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"; exec docker-entrypoint.sh "$$@"'
      - docker-entrypoint
    command: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: kyren
      POSTGRES_USER: kyren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyren -d kyren"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: kyren-migrate:${KYREN_VERSION:-latest}
    build:
      context: ..
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://kyren:${POSTGRES_PASSWORD:-}@db:5432/kyren}
    restart: "no"
    depends_on:
      # Waits for the bundled database when it runs; ignored with an outside one.
      db:
        condition: service_healthy
        required: false

  web:
    # Tagged per release, so the previous image is still there to roll back to.
    image: kyren-web:${KYREN_VERSION:-latest}
    build:
      context: ..
      args:
        NEXT_PUBLIC_BASE_URL: https://${DOMAIN}
    environment:
      <<: *app-env
      PORT: "3000"
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Background work every minute (scheduled messages, reminders, recurring
  # tasks, queued emails, webhooks); the heavy sweeps once a day at 03:00 UTC.
  cron:
    build:
      context: ./cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_URL: http://web:3000/api/cron/chat
      # Also watches the app and the disk, and alerts here (see cron/run.sh).
      HEALTH_URL: http://web:3000/api/health/deep
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      - web

  # Encrypted backups off this machine, every night (see backup/backup.sh).
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://kyren:${POSTGRES_PASSWORD:-}@db:5432/kyren}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT (age public key)}
      BACKUP_REMOTE: ${BACKUP_REMOTE:?set BACKUP_REMOTE (rclone path)}
      BACKUP_AT: ${BACKUP_AT:-0230}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      RCLONE_CONFIG_REMOTE_TYPE: ${RCLONE_CONFIG_REMOTE_TYPE:-}
      RCLONE_CONFIG_REMOTE_PROVIDER: ${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTE_REGION: ${RCLONE_CONFIG_REMOTE_REGION:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
        required: false

  clamav:
    # Optional, self-hosted virus scanner for uploads; updates its own
    # signatures every few hours. Needs about 1.5 GB of memory.
    image: clamav/clamav-debian:1.4
    profiles: [clamav]
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  clamav:
